name: Automação Diária de Prospecção & Disparo TraduzTudo OS

on:
  schedule:
    # Horários em UTC (Horário de Brasília = UTC - 3)
    # Roda TODOS OS DIAS DA SEMANA (Segunda a Domingo sem interrupção)
    # Ciclos distribuídos para cobrir a meta diária de 200 e-mails com total segurança SMTP:
    - cron: '0 10 * * *'   # 07:00 BRT
    - cron: '0 12 * * *'   # 09:00 BRT
    - cron: '0 14 * * *'   # 11:00 BRT
    - cron: '30 16 * * *'  # 13:30 BRT
    - cron: '0 18 * * *'   # 15:00 BRT
    - cron: '30 19 * * *'  # 16:30 BRT
    - cron: '0 21 * * *'   # 18:00 BRT
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação manual a executar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'discover'
          - 'dispatch'

jobs:
  prospecting:
    runs-on: ubuntu-latest
    steps:
      - name: Descoberta Contínua de Novas Empresas (Gemini Flash AI)
        if: github.event.inputs.action != 'dispatch'
        run: |
          echo "Iniciando Descoberta Contínua de Empresas com Gemini AI..."
          SEGMENTS=("CIDADANIA_ITALIANA" "ADVOCACIA_INTERNACIONAL" "COMERCIO_EXTERIOR" "VISTOS_IMIGRACAO")
          # Sorteia 2 segmentos por ciclo para variedade constante
          SHUFFLED=($(shuf -e "${SEGMENTS[@]}"))
          for seg in "${SHUFFLED[0]}" "${SHUFFLED[1]}"; do
            echo "Buscando nicho: $seg..."
            curl -s -X POST "https://traduztudo-os.vercel.app/api/prospecting/search/ai" \
              -H "Content-Type: application/json" \
              -d "{\"segment\": \"$seg\", \"targetCount\": 15}"
            sleep 3
          done

      - name: Disparo Controlado de Campanha (Hostinger SMTP + PDF Anexo)
        if: github.event.inputs.action != 'discover'
        run: |
          echo "Iniciando Disparo de E-mails via Hostinger SMTP (sub-lotes com anexo PDF)..."
          for i in $(seq 1 6); do
            echo "Disparando sub-lote $i de 5 e-mails..."
            curl -s -X POST "https://traduztudo-os.vercel.app/api/prospecting/cron/dispatch" \
              -H "Content-Type: application/json" \
              -H "x-manual-trigger: true" \
              -d '{"limitCount": 5}'
            sleep 4
          done
