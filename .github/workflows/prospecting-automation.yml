name: Automação Contínua de Prospecção (50 e-mails/hora) TraduzTudo OS

on:
  schedule:
    # Watchdog de batimento: verifica a cada 30 minutos dia e noite (24/7)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      continuous:
        description: 'Rodar em modo contínuo sem parar (true/false)'
        required: false
        default: 'true'

concurrency:
  group: prospecting-automation-runner
  cancel-in-progress: false

jobs:
  prospecting:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Suporte total a 6 horas ininterruptas por runner
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar GitHub CLI e Configurar Token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GH_TOKEN configured"

      - name: Executar Motor de Cadência Contínua (50 e-mails/hora 24/7)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Executa continuamente por 330 minutos (~5h30min) antes de passar o bastão para o próximo ciclo
          node scripts/prospecting-pacer.mjs --continuous --max-minutes 330
