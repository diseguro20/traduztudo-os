name: Automação Diária de Prospecção & Disparo TraduzTudo OS

on:
  schedule:
    # Horários em UTC (Horário de Brasília = UTC - 3)
    # Segunda a Sexta-feira:
    # 07:00 BRT (10:00 UTC) -> Busca Diária de Novas Empresas
    - cron: '0 10 * * 1-5'
    # 09:30 BRT (12:30 UTC) -> Disparo Lote 1 (50 e-mails)
    - cron: '30 12 * * 1-5'
    # 11:30 BRT (14:30 UTC) -> Disparo Lote 2 (50 e-mails)
    - cron: '30 14 * * 1-5'
    # 14:00 BRT (17:00 UTC) -> Disparo Lote 3 (50 e-mails)
    - cron: '0 17 * * 1-5'
    # 16:30 BRT (19:30 UTC) -> Disparo Lote 4 (50 e-mails)
    - cron: '30 19 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação manual a executar'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'discover'
          - 'dispatch'

jobs:
  prospecting:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Rotina de Descoberta Matinal
        if: github.event.schedule == '0 10 * * 1-5' || github.event.inputs.action == 'discover' || github.event.inputs.action == 'all'
        run: |
          echo "Iniciando Descoberta Diária de Empresas..."
          curl -s -X POST "https://traduztudo-os.vercel.app/api/prospecting/cron/discover" \
            -H "Content-Type: application/json" \
            -H "x-manual-trigger: true" \
            -d '{"targetCount": 100}'

      - name: Executar Disparo de Campanha (Lote Controlado 50 e-mails)
        if: github.event.schedule != '0 10 * * 1-5' || github.event.inputs.action == 'dispatch' || github.event.inputs.action == 'all'
        run: |
          echo "Iniciando Disparo de E-mails via Hostinger SMTP..."
          curl -s -X POST "https://traduztudo-os.vercel.app/api/prospecting/cron/dispatch" \
            -H "Content-Type: application/json" \
            -H "x-manual-trigger: true" \
            -d '{"limitCount": 50}'
