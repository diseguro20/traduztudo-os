name: Automação Contínua de Prospecção (50 e-mails/hora) TraduzTudo OS

on:
  schedule:
    # Executa a cada 30 minutos, dia e noite (24/7)
    # Cada ciclo envia 25 e-mails espaçados a cada ~72 segundos = 50 e-mails por hora!
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      batchSize:
        description: 'Quantidade de e-mails para este lote (padrão 25 = 30min de envio cadenciado)'
        required: false
        default: '25'

jobs:
  prospecting:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Motor de Cadência Contínua (50 e-mails/hora)
        run: |
          BATCH="${{ github.event.inputs.batchSize || '25' }}"
          node scripts/prospecting-pacer.mjs --batch "$BATCH"
